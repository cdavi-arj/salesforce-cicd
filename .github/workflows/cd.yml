name: Deploy to QA

on:
  push:
    branches:
      - develop

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # ---------------------------------
      # Checkout repository
      # ---------------------------------
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ---------------------------------
      # Install Salesforce CLI
      # ---------------------------------
      - name: Install Salesforce CLI
        run: |
          npm install -g @salesforce/cli@latest
          sf version

      # ---------------------------------
      # Install sfdx-git-delta
      # ---------------------------------
      - name: Install sfdx-git-delta
        run: |
          echo y | sf plugins install sfdx-git-delta
          sf plugins

      # ---------------------------------
      # Generate Delta
      # ---------------------------------
      - name: Generate Delta
        run: |
          mkdir -p delta
          # compara com o commit anterior na develop
          sf sgd source delta \
            --to HEAD \
            --from HEAD~1 \
            --output-dir delta \
            --generate-delta

      # ---------------------------------
      # Check if delta is empty
      # ---------------------------------
      - name: Check Delta
        id: check_delta
        run: |
          if [ -z "$(ls -A delta)" ]; then
            echo "No delta found"
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "Delta found"
            echo "skip=false" >> $GITHUB_OUTPUT

      # ---------------------------------
      # Create JWT Key
      # ---------------------------------
      - name: Create JWT Key
        run: echo "${{ secrets.SF_JWT_KEY }}" > server.key

      # ---------------------------------
      # Authenticate QA Sandbox
      # ---------------------------------
      - name: Authenticate QA
        run: |
          sf org login jwt \
            --client-id ${{ secrets.SF_CLIENT_ID }} \
            --jwt-key-file server.key \
            --username ${{ secrets.SF_USERNAME_QA }} \
            --alias qa \
            --instance-url https://test.salesforce.com

      # ---------------------------------
      # Determine tests to run
      # ---------------------------------
      - name: Set Tests to Run
        id: tests
        run: |
          # padrão: nenhum teste específico
          TESTS="none"

          # Se estiver disponível, tenta extrair da descrição da PR (merge commit)
          if [ ! -z "${{ github.event.head_commit.message }}" ]; then
            BODY="${{ github.event.head_commit.message }}"
            MATCH=$(echo "$BODY" | sed -n 's/.*Apex::\[\(.*\)\]::Apex.*/\1/p')
            if [ ! -z "$MATCH" ]; then
              TRIMMED=$(echo "$MATCH" | tr -d '[:space:]')
              if [ "$TRIMMED" = "all" ]; then
                TESTS="all"
              elif [ "$TRIMMED" = "none" ]; then
                TESTS="none"
              else
                TESTS="$MATCH"
              fi
            fi
          fi

          echo "tests=$TESTS" >> $GITHUB_OUTPUT

      # ---------------------------------
      # Deploy Delta to QA
      # ---------------------------------
      - name: Deploy Delta to QA
        if: steps.check_delta.outputs.skip == 'false'
        run: |
          TESTS="${{ steps.tests.outputs.tests }}"

          if [ "$TESTS" = "none" ]; then
            echo "No specific tests found. Running relevant tests only."
            sf project deploy start \
              --source-dir delta \
              --target-org qa \
              --test-level RunRelevantTests \
              --wait 30

          elif [ "$TESTS" = "all" ]; then
            echo "Running all tests..."
            sf project deploy start \
              --source-dir delta \
              --target-org qa \
              --test-level RunAllTestsInOrg \
              --wait 30

          else
            echo "Running specified tests: $TESTS"
            sf project deploy start \
              --source-dir delta \
              --target-org qa \
              --test-level RunSpecifiedTests \
              --tests "$TESTS" \
              --wait 30

      # ---------------------------------
      # Success
      # ---------------------------------
      - name: Success
        if: success()
        run: echo "Deployment to QA completed successfully."
