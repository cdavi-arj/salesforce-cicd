name: Deploy Delta to QA

on:
  push:
    branches:
      - develop
    paths:
      - 'force-app/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.actor != 'dependabot[bot]' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq bc

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Salesforce CLI
        run: |
          npm install -g @salesforce/cli
          sf version

      - name: Install sfdx-git-delta
        run: |
          echo y | sf plugins install sfdx-git-delta

      - name: Create JWT Key
        run: echo "${{ secrets.SF_JWT_KEY }}" > server.key

      - name: Authenticate QA
        run: |
          sf org login jwt \
            --client-id ${{ secrets.SF_CLIENT_ID }} \
            --jwt-key-file server.key \
            --username ${{ secrets.SF_USERNAME_QA }} \
            --alias qa \
            --instance-url https://test.salesforce.com

      - name: Generate Delta
        run: |
          mkdir -p delta
          git fetch origin develop
          sf sgd source delta \
            --to HEAD \
            --from origin/develop \
            --output-dir delta \
            --generate-delta \
            --source force-app/

      - name: Check Delta
        id: check_delta
        run: |
          if [ -z "$(ls -A delta)" ]; then
            echo "No changes detected. Skipping deploy."
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "Changes detected."
            echo "skip=false" >> $GITHUB_OUTPUT

      - name: Set Tests to Run
        if: steps.check_delta.outputs.skip == 'false'
        id: tests
        run: |
          TESTS="none"
          BODY="${{ github.event.head_commit.message }}"
          MATCH=$(echo "$BODY" | sed -n 's/.*Apex::\[\(.*\)\]::Apex.*/\1/p')
          if [ ! -z "$MATCH" ]; then
            TRIMMED=$(echo "$MATCH" | tr -d '[:space:]')
            if [ "$TRIMMED" = "all" ]; then
              TESTS="all"
            elif [ "$TRIMMED" = "none" ]; then
              TESTS="none"
            else
              TESTS="$MATCH"
            fi
          fi
          echo "tests=$TESTS" >> $GITHUB_OUTPUT

      - name: Deploy Delta
        if: steps.check_delta.outputs.skip == 'false'
        run: |
          TESTS="${{ steps.tests.outputs.tests }}"

          if [ "$TESTS" = "none" ]; then
            echo "No tests specified. Running relevant tests only."
            sf project deploy start \
              --source-dir delta \
              --target-org qa \
              --test-level RunRelevantTests \
              --wait 30 \
              --ignore-warnings \
              --ignore-conflicts

          elif [ "$TESTS" = "all" ]; then
            echo "Running all tests..."
            sf project deploy start \
              --source-dir delta \
              --target-org qa \
              --test-level RunAllTestsInOrg \
              --wait 30 \
              --ignore-warnings \
              --ignore-conflicts

          else
            echo "Running specified tests: $TESTS"
            sf project deploy start \
              --source-dir delta \
              --target-org qa \
              --test-level RunSpecifiedTests \
              --tests "$TESTS" \
              --wait 30 \
              --ignore-warnings \
              --ignore-conflicts

      - name: Deploy Destructive Changes
        if: steps.check_delta.outputs.skip == 'false'
        run: |
          if [ -d "delta/destructiveChanges" ] && [ "$(ls -A delta/destructiveChanges)" ]; then
            echo "Deploying destructive changes..."
            sf project deploy start \
              --source-dir delta/destructiveChanges \
              --target-org qa \
              --test-level RunRelevantTests \
              --wait 30 \
              --ignore-warnings \
              --ignore-conflicts
          else
            echo "No destructive changes found."

      - name: Success
        if: success()
        run: echo "Deployment completed successfully."
