name: Deploy to QA

on:
  push:
    branches:
      - develop

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # ---------------------------------
      # Checkout repository
      # ---------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ---------------------------------
      # Install dependencies
      # ---------------------------------
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq bc

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # ---------------------------------
      # Install Salesforce CLI
      # ---------------------------------
      - name: Install Salesforce CLI
        run: |
          npm install -g @salesforce/cli
          sf version

      # ---------------------------------
      # Install Plugins
      # ---------------------------------
      - name: Install sfdx-git-delta
        run: |
          echo y | sf plugins install sfdx-git-delta

      # ---------------------------------
      # Generate Delta
      # ---------------------------------
      - name: Generate Delta
        run: |
          mkdir -p delta
          # tenta gerar delta do último commit
          sf sgd source delta \
            --to HEAD \
            --from HEAD~1 \
            --output-dir delta \
            --generate-delta || echo "No delta generated"

      # ---------------------------------
      # Create JWT Key
      # ---------------------------------
      - name: Create JWT Key
        run: echo "${{ secrets.SF_JWT_KEY }}" > server.key

      # ---------------------------------
      # Authenticate QA Sandbox
      # ---------------------------------
      - name: Authenticate QA
        run: |
          sf org login jwt \
            --client-id ${{ secrets.SF_CLIENT_ID }} \
            --jwt-key-file server.key \
            --username ${{ secrets.SF_USERNAME_QA }} \
            --alias qa \
            --instance-url https://test.salesforce.com

      # ---------------------------------
      # Determine tests to run from commit message
      # ---------------------------------
      - name: Set Tests to Run
        id: tests
        run: |
          TESTS="none"
          BODY="${{ github.event.head_commit.message }}"
          MATCH=$(echo "$BODY" | sed -n 's/.*Apex::\[\(.*\)\]::Apex.*/\1/p')
          if [ ! -z "$MATCH" ]; then
            TRIMMED=$(echo "$MATCH" | tr -d '[:space:]')
            if [ "$TRIMMED" = "all" ]; then
              TESTS="all"
            elif [ "$TRIMMED" = "none" ]; then
              TESTS="none"
            else
              TESTS="$MATCH"
            fi
          fi
          echo "tests=$TESTS" >> $GITHUB_OUTPUT

      # ---------------------------------
      # Deploy Delta or full source
      # ---------------------------------
      - name: Deploy to QA
        run: |
          TESTS="${{ steps.tests.outputs.tests }}"
          
          # Se delta estiver vazio, deploy completo de force-app
          DIR="delta"
          if [ ! -d "$DIR" ] || [ -z "$(ls -A $DIR)" ]; then
            echo "Delta empty or missing. Deploying full force-app..."
            DIR="force-app"
          else
            echo "Deploying delta..."
          fi

          if [ "$TESTS" = "none" ]; then
            echo "No tests specified. Running relevant tests only."
            sf project deploy start \
              --source-dir $DIR \
              --target-org qa \
              --test-level RunRelevantTests \
              --wait 30

          elif [ "$TESTS" = "all" ]; then
            echo "Running all tests..."
            sf project deploy start \
              --source-dir $DIR \
              --target-org qa \
              --test-level RunAllTestsInOrg \
              --wait 30

          else
            echo "Running specified tests: $TESTS"
            sf project deploy start \
              --source-dir $DIR \
              --target-org qa \
              --test-level RunSpecifiedTests \
              --tests "$TESTS" \
              --wait 30

      # ---------------------------------
      # Success
      # ---------------------------------
      - name: Success
        if: success()
        run: echo "Deployment to QA completed successfully."
