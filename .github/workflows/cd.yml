name: Deploy to QA

on:
  push:
    branches:
      - develop
    paths:
      - 'force-app/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.actor != 'dependabot[bot]' }}

    steps:
      # ---------------------------------
      # Checkout repository
      # ---------------------------------
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ---------------------------------
      # Install Salesforce CLI
      # ---------------------------------
      - name: Install Salesforce CLI
        run: |
          wget https://developer.salesforce.com/media/salesforce-cli/sfdx/channels/stable/sfdx-linux-x64.tar.xz
          mkdir ~/sfdx
          tar xJf sfdx-linux-x64.tar.xz -C ~/sfdx --strip-components 1
          echo "$HOME/sfdx/bin" >> $GITHUB_PATH
          ~/sfdx/bin/sfdx version

      # ---------------------------------
      # Install sfdx-git-delta plugin
      # ---------------------------------
      - name: Install sfdx-git-delta
        run: |
          echo y | sfdx plugins:install sfdx-git-delta
          sfdx plugins

      # ---------------------------------
      # Create JWT key
      # ---------------------------------
      - name: Create JWT Key
        run: echo "${{ secrets.SF_JWT_KEY }}" > server.key

      # ---------------------------------
      # Authenticate QA Sandbox
      # ---------------------------------
      - name: Authenticate QA
        run: |
          sf org login jwt \
            --client-id ${{ secrets.SF_CLIENT_ID }} \
            --jwt-key-file server.key \
            --username ${{ secrets.SF_USERNAME_QA }} \
            --alias qa \
            --instance-url https://test.salesforce.com

      # ---------------------------------
      # Generate Delta
      # ---------------------------------
      - name: Generate Delta
        run: |
          mkdir -p delta
          # Compara com a branch remota develop para push direto
          sf sgd source delta \
            --to HEAD \
            --from origin/develop \
            --output-dir delta \
            --generate-delta \
            --source force-app/

      # ---------------------------------
      # Check if Delta is Empty
      # ---------------------------------
      - name: Check Delta
        id: check_delta
        run: |
          if [ -z "$(ls -A delta)" ]; then
            echo "No changes to deploy. Skipping."
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "Delta found."
            echo "skip=false" >> $GITHUB_OUTPUT

      # ---------------------------------
      # Determine tests to run from commit message
      # Use pattern: Apex::[Class1,Class2]::Apex
      # ---------------------------------
      - name: Set Tests to Run
        if: steps.check_delta.outputs.skip == 'false'
        id: tests
        run: |
          TESTS="none"
          BODY="${{ github.event.head_commit.message }}"
          MATCH=$(echo "$BODY" | sed -n 's/.*Apex::\[\(.*\)\]::Apex.*/\1/p')
          if [ ! -z "$MATCH" ]; then
            TRIMMED=$(echo "$MATCH" | tr -d '[:space:]')
            if [ "$TRIMMED" = "all" ]; then
              TESTS="all"
            elif [ "$TRIMMED" = "none" ]; then
              TESTS="none"
            else
              TESTS="$MATCH"
            fi
          fi
          echo "tests=$TESTS" >> $GITHUB_OUTPUT

      # ---------------------------------
      # Deploy Delta
      # ---------------------------------
      - name: Deploy Delta to QA
        if: steps.check_delta.outputs.skip == 'false'
        run: |
          TESTS="${{ steps.tests.outputs.tests }}"

          if [ "$TESTS" = "none" ]; then
            echo "No tests specified. Running relevant tests only."
            sf project deploy start \
              --source-dir delta \
              --target-org qa \
              --test-level RunRelevantTests \
              --wait 30

          elif [ "$TESTS" = "all" ]; then
            echo "Running all tests..."
            sf project deploy start \
              --source-dir delta \
              --target-org qa \
              --test-level RunAllTestsInOrg \
              --wait 30

          else
            echo "Running specified tests: $TESTS"
            sf project deploy start \
              --source-dir delta \
              --target-org qa \
              --test-level RunSpecifiedTests \
              --tests "$TESTS" \
              --wait 30

      # ---------------------------------
      # Success
      # ---------------------------------
      - name: Success
        if: success()
        run: echo "Deployment to QA completed successfully."
