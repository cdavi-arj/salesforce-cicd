name: Validate and Deploy to QA

on:
  pull_request:
    branches:
      - develop

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Salesforce CLI
        run: |
          npm install --global @salesforce/cli
          sf version

      - name: Install sfdx-git-delta plugin
        run: |
          echo y | sf plugins install sfdx-git-delta
          sf plugins

      - name: Generate Delta
        run: |
          sf sgd source delta \
            --to "HEAD" \
            --from "origin/develop" \
            --output-dir delta \
            --generate-delta

      - name: Authenticate to QA (Sandbox)
        run: |
          echo "${{ secrets.SF_JWT_KEY_QA }}" > server.key
          sf org login jwt \
            --client-id ${{ secrets.SF_CLIENT_ID_QA }} \
            --jwt-key-file server.key \
            --username ${{ secrets.SF_USERNAME_QA }} \
            --alias qa \
            --instance-url https://test.salesforce.com

      - name: Extract Apex Tests from PR
        id: tests
        run: |
          BODY="${{ github.event.pull_request.body }}"
          TESTS=$(echo "$BODY" | grep -oP '(?<=Apex::\[).*?(?=\]::Apex)')
          echo "tests=$TESTS" >> $GITHUB_OUTPUT

      - name: Validate Deployment in QA
        run: |
          if [ "${{ steps.tests.outputs.tests }}" = "all" ]; then
            sf project deploy validate \
              --source-dir delta \
              --target-org qa \
              --test-level RunAllTestsInOrg
          else
            sf project deploy validate \
              --source-dir delta \
              --target-org qa \
              --test-level RunSpecifiedTests \
              --tests "${{ steps.tests.outputs.tests }}"
          fi
