name: PR Validation - QA

on:
  pull_request:
    branches:
      - develop

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      # Checkout completo (necessário para delta)
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Instalar CLI moderna (para deploy)
      - name: Install Salesforce CLI (sf)
        run: |
          npm install --global @salesforce/cli@latest
          sf version

      # Instalar CLI legacy (para delta)
      - name: Install SFDX CLI (legacy)
        run: |
          npm install --global sfdx-cli
          sfdx version

      # Instalar plugin delta no CLI legacy
      - name: Install sfdx-git-delta
        run: |
          echo y | sfdx plugins:install sfdx-git-delta
          sfdx plugins

      # 🔹 Gerar Delta
      - name: Generate Delta
        run: |
          sfdx sgd:source:delta \
            --to HEAD \
            --from origin/develop \
            --output delta \
            --generate-delta

      # 🔥 Extrair testes da PR
      - name: Extract Apex Tests From PR
        id: extract_tests
        run: |
          PR_BODY="${{ github.event.pull_request.body }}"

          if [[ "$PR_BODY" =~ Apex::\[(.*)\]::Apex ]]; then
            TESTS="${BASH_REMATCH[1]}"

            if [[ "$TESTS" == "all" ]]; then
              echo "testlevel=RunLocalTests" >> $GITHUB_OUTPUT
            else
              echo "testlevel=RunSpecifiedTests" >> $GITHUB_OUTPUT
              echo "tests=$TESTS" >> $GITHUB_OUTPUT
            fi
          else
            echo "testlevel=RunLocalTests" >> $GITHUB_OUTPUT
          fi

      # Criar chave JWT
      - name: Create JWT Key
        run: echo "${{ secrets.SF_JWT_KEY }}" > server.key

      # Login Sandbox QA
      - name: Authenticate QA Sandbox
        run: |
          sf org login jwt \
            --client-id ${{ secrets.SF_CLIENT_ID }} \
            --jwt-key-file server.key \
            --username ${{ secrets.SF_USERNAME_QA }} \
            --alias qa \
            --instance-url https://test.salesforce.com

      # 🚀 Validação dinâmica
      - name: Validate Deployment (Delta)
        run: |
          if [ "${{ steps.extract_tests.outputs.testlevel }}" == "RunSpecifiedTests" ]; then
            sf project deploy validate \
              --source-dir delta \
              --target-org qa \
              --test-level RunSpecifiedTests \
              --tests "${{ steps.extract_tests.outputs.tests }}" \
              --wait 30
          else
            sf project deploy validate \
              --source-dir delta \
              --target-org qa \
              --test-level RunLocalTests \
              --wait 30
          fi
