name: Validate Delta Deployment to QA

on:
  pull_request:
    branches:
      - develop

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Salesforce CLI
        run: |
          npm install -g @salesforce/cli@latest
          sf version

      - name: Install sfdx-git-delta
        run: |
          echo y | sf plugins install sfdx-git-delta
          sf plugins

      # Generate delta between PR and base
      - name: Generate Delta
        run: |
          mkdir -p delta
          BASE_BRANCH=${{ github.event.pull_request.base.ref }}
          sf sgd source delta \
            --to HEAD \
            --from origin/$BASE_BRANCH \
            --output-dir delta \
            --generate-delta

      # Check if delta is empty
      - name: Check Delta
        id: check_delta
        run: |
          if [ -z "$(ls -A delta)" ]; then
            echo "No delta found"
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "Delta found"
            echo "skip=false" >> $GITHUB_OUTPUT

      # Create JWT Key
      - name: Create JWT Key
        run: echo "${{ secrets.SF_JWT_KEY }}" > server.key

      # Authenticate QA Sandbox
      - name: Authenticate QA
        if: steps.check_delta.outputs.skip == 'false'
        run: |
          sf org login jwt \
            --client-id ${{ secrets.SF_CLIENT_ID }} \
            --jwt-key-file server.key \
            --username ${{ secrets.SF_USERNAME_QA }} \
            --alias qa \
            --instance-url https://test.salesforce.com

      # Extract Apex tests from PR body
      - name: Extract Apex Tests
        if: steps.check_delta.outputs.skip == 'false'
        id: tests
        run: |
          BODY="${{ github.event.pull_request.body }}"
          TESTS="none"
          MATCH=$(echo "$BODY" | sed -n 's/.*Apex::\[\(.*\)\]::Apex.*/\1/p')
          if [ ! -z "$MATCH" ]; then
            TRIMMED=$(echo "$MATCH" | tr -d '[:space:]')
            if [ "$TRIMMED" = "all" ]; then
              TESTS="all"
            elif [ "$TRIMMED" = "none" ]; then
              TESTS="none"
            else
              TESTS="$MATCH"
            fi
          fi
          echo "tests=$TESTS" >> $GITHUB_OUTPUT

      # Deploy validation
      - name: Validate Deployment
        if: steps.check_delta.outputs.skip == 'false'
        run: |
          TESTS="${{ steps.tests.outputs.tests }}"

          if [ "$TESTS" = "none" ]; then
            echo "No specific tests. Running relevant tests."
            sf project deploy validate \
              --source-dir delta \
              --target-org qa \
              --test-level RunRelevantTests \
              --coverage-formatters json \
              --results-dir coverage

          elif [ "$TESTS" = "all" ]; then
            echo "Running all tests..."
            sf project deploy validate \
              --source-dir delta \
              --target-org qa \
              --test-level RunAllTestsInOrg \
              --coverage-formatters json \
              --results-dir coverage

          else
            echo "Running specified tests: $TESTS"
            sf project deploy validate \
              --source-dir delta \
              --target-org qa \
              --test-level RunSpecifiedTests \
              --tests "$TESTS" \
              --coverage-formatters json \
              --results-dir coverage

      - name: Success
        if: success()
        run: echo "QA Validation completed successfully."
