name: Validate Delta Deployment to QA

on:
  pull_request:
    branches:
      - develop

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      # ---------------------------------
      # Checkout repository
      # ---------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ---------------------------------
      # Install system dependencies
      # ---------------------------------
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq bc

      # ---------------------------------
      # Install Salesforce CLI
      # ---------------------------------
      - name: Install Salesforce CLI
        run: |
          npm install --global @salesforce/cli
          sf version

      # ---------------------------------
      # Install Required Plugins
      # ---------------------------------
      - name: Install Plugins
        run: |
          sf plugins install sfdx-git-delta --force
          sf plugins install code-analyzer --force
          sf plugins

      # ---------------------------------
      # Run Code Quality Scan
      # Blocks severity >= 3 (Moderate+)
      # ---------------------------------
      - name: Run Code Quality Scan
        run: |
          sf code-analyzer run \
            --workspace force-app \
            --severity-threshold 3

      # ---------------------------------
      # Generate Delta
      # ---------------------------------
      - name: Generate Delta
        run: |
          mkdir -p delta
          BASE_BRANCH=${{ github.event.pull_request.base.ref }}

          git fetch origin $BASE_BRANCH

          sf sfdx-git-delta:source:delta \
            --to "HEAD" \
            --from "origin/$BASE_BRANCH" \
            --output-dir delta \
            --generate-delta

      # ---------------------------------
      # Check if Delta is Empty
      # ---------------------------------
      - name: Check if Delta is Empty
        id: check_delta
        run: |
          if [ -z "$(ls -A delta)" ]; then
            echo "No changes detected. Skipping deployment."
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      # ---------------------------------
      # Authenticate to QA (Sandbox)
      # ---------------------------------
      - name: Authenticate to QA
        if: steps.check_delta.outputs.skip == 'false'
        run: |
          echo "${{ secrets.SF_JWT_KEY }}" > server.key
          sf org login jwt \
            --client-id ${{ secrets.SF_CLIENT_ID }} \
            --jwt-key-file server.key \
            --username ${{ secrets.SF_USERNAME_QA }} \
            --alias qa \
            --instance-url https://test.salesforce.com

      # ---------------------------------
      # Extract Apex Tests from PR Body
      # Pattern: Apex::[Class1,Class2]::Apex
      # ---------------------------------
      - name: Extract Apex Tests
        if: steps.check_delta.outputs.skip == 'false'
        id: tests
        run: |
          BODY="${{ github.event.pull_request.body }}"
          TESTS=$(echo "$BODY" | sed -n 's/.*Apex::\[\(.*\)\]::Apex.*/\1/p')

          if [ -z "$TESTS" ]; then
            echo "No test pattern found. Running all tests."
            TESTS="all"
          fi

          echo "tests=$TESTS" >> $GITHUB_OUTPUT

      # ---------------------------------
      # Validate Deployment
      # ---------------------------------
      - name: Validate Deployment
        if: steps.check_delta.outputs.skip == 'false'
        run: |
          if [ "${{ steps.tests.outputs.tests }}" = "all" ]; then
            sf project deploy validate \
              --source-dir delta \
              --target-org qa \
              --test-level RunAllTestsInOrg \
              --coverage-formatters json \
              --results-dir coverage
          else
            sf project deploy validate \
              --source-dir delta \
              --target-org qa \
              --test-level RunSpecifiedTests \
              --tests "${{ steps.tests.outputs.tests }}" \
              --coverage-formatters json \
              --results-dir coverage
          fi

      # ---------------------------------
      # Enforce Minimum Coverage 85%
      # ---------------------------------
      - name: Enforce Coverage >= 85%
        if: steps.check_delta.outputs.skip == 'false'
        run: |
          COVERAGE=$(jq '.result.summary.testRunCoverage' coverage/test-result-codecoverage.json)

          echo "Org Coverage: $COVERAGE%"

          if (( $(echo "$COVERAGE < 85" | bc -l) )); then
            echo "Coverage is below 85%. Failing pipeline."
            exit 1
          fi

      # ---------------------------------
      # Success
      # ---------------------------------
      - name: Success
        if: success()
        run: echo "QA Validation completed successfully."
