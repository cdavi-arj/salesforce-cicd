name: Salesforce CI - Validate on QA

on:
  pull_request:
    branches:
      - develop

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout do código
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Instalar Salesforce CLI
      - name: Install Salesforce CLI
        run: npm install --global @salesforce/cli

      # 3️⃣ Criar arquivo de chave privada
      - name: Create server.key file
        run: |
          echo "${{ secrets.SF_JWT_KEY }}" > server.key

      # 4️⃣ Autenticar na org QA via JWT
      - name: Authenticate to QA
        run: |
          sf org login jwt \
            --client-id ${{ secrets.SF_CLIENT_ID }} \
            --jwt-key-file server.key \
            --username ${{ secrets.SF_USERNAME }} \
            --alias qa \
            --instance-url https://login.salesforce.com

      # 5️⃣ Validar deploy (sem aplicar)
      - name: Validate Deployment
        run: |
          sf project deploy validate \
            --source-dir force-app \
            --target-org qa \
            --test-level RunLocalTests \
            --wait 30
